default: &default
  adapter: postgresql
  encoding: unicode
  url: <%= ENV['DATABASE_URL'] %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: irofumi_development

test:
  <<: *default
  database: irofumi_test

production:
  <<: *default
  database: irofumi_production
